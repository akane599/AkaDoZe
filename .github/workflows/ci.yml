name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Unit tests, lint and APK builds
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Robolectric's SDK 36 runtime needs JDK 21; the app itself still targets Java 17 bytecode.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Same tasks as the local full gate. Release is debug-signed here: no RELEASE_KEYSTORE secrets are passed.
      - name: Run the gate
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleRelease --console=plain

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 7

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
